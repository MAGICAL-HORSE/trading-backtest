# ============================================================
# Aggressive Small-Cap Options Day Trading Bot — Configuration
# All parameters live here; nothing is hardcoded in the source.
# ============================================================

# ── Universe & Scanner ────────────────────────────────────────
scanner:
  interval_seconds: 300          # Run every 5 minutes
  top_n: 5                       # Keep top-N stocks per scan cycle
  price_min: 2.00
  price_max: 50.00
  market_cap_max: 10_000_000_000 # $10 billion (loosened from $2B)
  volume_spike_multiplier: 1.5   # Current vol > 1.5× 20-day avg (loosened)
  min_intraday_move_pct: 1.5     # ±1.5% intraday move required (loosened)
  volume_lookback_days: 20       # Days for avg volume baseline
  sectors:
    biotech:
      gics_code: "352"
      etf_proxy: "XBI"           # Used to seed universe
    energy:
      gics_code: "101"
      etf_proxy: "XLE"

# ── Options Liquidity Requirements ───────────────────────────
options:
  min_open_interest: 100         # Lowered from 500 (loosened)
  max_spread_entry: 0.50         # Hard skip if spread > $0.50 at entry (loosened)
  max_spread_scan: 0.40          # Soft filter during scan (loosened)
  min_expirations: 2             # At least 2 expiry dates available
  require_weekly: true
  min_dte: 2                     # Never buy < 1 DTE on small caps (guard)
  strike_preference: "atm_itm"   # First ITM or ATM strike
  expiry_strategy: "nearest_weekly"
  # Roll to next week after Wednesday (DTE-based check)
  roll_after_weekday: 2          # 0=Mon … 4=Fri; 2=Wednesday

# ── Strategy & Signal Generation ─────────────────────────────
strategy:
  rsi_period: 14
  rsi_call_threshold: 60         # RSI > 60 → consider calls
  rsi_put_threshold: 40          # RSI < 40 → consider puts
  atr_period: 10
  atr_expansion_multiplier: 1.3  # Current ATR > 1.3× 10-period avg
  vwap_timeframes: ["1m", "5m"]  # Both must confirm breakout
  # Confidence score thresholds
  confidence:
    min_to_trade: 60
    tiers:
      - {min: 60, max: 74, size_pct: 5.0}
      - {min: 75, max: 89, size_pct: 8.0}
      - {min: 90, max: 100, size_pct: 12.0}

# ── Risk Management ──────────────────────────────────────────
risk:
  stop_loss_pct: 35.0            # Exit at 35% loss on premium
  profit_target_min_pct: 30.0
  profit_target_max_pct: 100.0
  max_hold_minutes: 90           # Hard exit regardless of P&L
  daily_loss_limit_pct: 4.0      # Halt ALL trading if daily loss ≥ 4%
  max_open_per_sector:
    biotech: 2
    energy: 2
  no_entry_before: "09:40"       # ET — skip first 10 minutes
  no_new_entry_after: "15:15"    # ET
  force_close_by: "15:45"        # ET — all positions must be flat
  gap_exit_threshold_pct: 8.0    # Immediate market exit if gap > 8%

# ── Execution ────────────────────────────────────────────────
execution:
  max_latency_ms: 500
  limit_reprice_interval_sec: 8
  limit_max_attempts: 3          # Convert to market after 3 misses
  order_type_initial: "limit"
  limit_price_offset: "mid"      # Place at mid-price

# ── Broker (Tradier) ─────────────────────────────────────────
broker:
  paper_base_url: "https://sandbox.tradier.com/v1"
  live_base_url:  "https://api.tradier.com/v1"
  timeout_seconds: 10
  order_class: "option"

# ── Data Sources ─────────────────────────────────────────────
polygon:
  base_url: "https://api.polygon.io"
  ws_url: "wss://socket.polygon.io/options"
  snapshot_batch_size: 50        # Tickers per snapshot request

benzinga:
  base_url: "https://api.benzinga.com/api/v2"
  # Keywords that confirm a biotech catalyst
  catalyst_keywords:
    - "FDA"
    - "NDA"
    - "BLA"
    - "IND"
    - "PDUFA"
    - "phase 1"
    - "phase 2"
    - "phase 3"
    - "trial results"
    - "clinical"
    - "approval"
    - "orphan drug"
    - "breakthrough therapy"
    - "earnings"
    - "beat"
  catalyst_lookback_hours: 24    # Look back 24 h for news

# ── Correlation (Energy) ─────────────────────────────────────
correlation:
  crude_proxy: "USO"             # Align energy trades with USO direction
  correlation_timeframe: "5m"
  min_alignment: true            # Must agree directionally

# ── Dashboard ────────────────────────────────────────────────
dashboard:
  refresh_rate: 1.0              # Seconds between UI refreshes
  max_trade_log_rows: 50

# ── Logging ──────────────────────────────────────────────────
logging:
  level: "INFO"
  format: "json"
  file: "logs/bot.jsonl"
  max_bytes: 10_485_760          # 10 MB
  backup_count: 5

# ── Backtesting ──────────────────────────────────────────────
backtest:
  # When BACKTEST=true, Polygon historical options data is used.
  # Date range set via CLI: --start YYYY-MM-DD --end YYYY-MM-DD
  default_start: "2024-01-01"
  default_end:   "2024-12-31"
  initial_capital: 25_000.00
