# ============================================================
# Aggressive Small-Cap Options Day Trading Bot — Configuration
# MAXIMUM AGGRESSION MODE — tuned to find and trade more setups
# ============================================================

# ── Universe & Scanner ────────────────────────────────────────
scanner:
  interval_seconds: 120          # Scan every 2 minutes (was 5)
  top_n: 10                      # Top 10 stocks per cycle (was 5)
  price_min: 1.00                # Lowered floor (was $2)
  price_max: 200.00              # Raised ceiling (was $50)
  market_cap_max: 50_000_000_000 # $50 billion (was $10B)
  volume_spike_multiplier: 1.2   # Easier to qualify (was 1.5)
  min_intraday_move_pct: 1.0     # 1% move required (was 1.5%)
  volume_lookback_days: 20
  sectors:
    biotech:
      gics_code: "352"
      etf_proxy: "XBI"
    energy:
      gics_code: "101"
      etf_proxy: "XLE"

# ── Options Liquidity Requirements ───────────────────────────
options:
  min_open_interest: 50          # Very loose (was 100)
  max_spread_entry: 1.00         # Wide spread allowed (was $0.50)
  max_spread_scan: 0.80          # Soft filter (was $0.40)
  min_expirations: 1             # Only need 1 expiry (was 2)
  require_weekly: false          # Don't require weeklies (was true)
  min_dte: 1                     # Allow 1 DTE (was 2)
  strike_preference: "atm_itm"
  expiry_strategy: "nearest_weekly"
  roll_after_weekday: 2

# ── Strategy & Signal Generation ─────────────────────────────
strategy:
  rsi_period: 14
  rsi_call_threshold: 55         # Lower bar for calls (was 60)
  rsi_put_threshold: 45          # Higher bar for puts (was 40)
  atr_period: 10
  atr_expansion_multiplier: 1.1  # Less expansion needed (was 1.3)
  vwap_timeframes: ["1m", "5m"]
  # Confidence score — bigger positions across all tiers
  confidence:
    min_to_trade: 45             # Lower threshold (was 60)
    tiers:
      - {min: 45, max: 64, size_pct: 8.0}   # Was 5%
      - {min: 65, max: 84, size_pct: 15.0}  # Was 8%
      - {min: 85, max: 100, size_pct: 25.0} # Was 12%

# ── Risk Management ──────────────────────────────────────────
risk:
  stop_loss_pct: 40.0            # Slightly wider stop (was 35%)
  profit_target_min_pct: 25.0    # Take profits sooner (was 30%)
  profit_target_max_pct: 150.0   # Let winners run further (was 100%)
  max_hold_minutes: 120          # 2 hour max hold (was 90 min)
  daily_loss_limit_pct: 8.0      # Higher daily limit (was 4%)
  max_open_per_sector:
    biotech: 4                   # More simultaneous positions (was 2)
    energy: 4                    # More simultaneous positions (was 2)
  no_entry_before: "09:35"       # Only skip first 5 min (was 9:40)
  no_new_entry_after: "15:30"    # Trade later into the day (was 3:15)
  force_close_by: "15:50"        # Close later (was 3:45)
  gap_exit_threshold_pct: 10.0   # More room before gap exit (was 8%)

# ── Execution ────────────────────────────────────────────────
execution:
  max_latency_ms: 500
  limit_reprice_interval_sec: 5  # Reprice faster (was 8s)
  limit_max_attempts: 4          # More attempts before market (was 3)
  order_type_initial: "limit"
  limit_price_offset: "mid"

# ── Broker (Tradier) ─────────────────────────────────────────
broker:
  paper_base_url: "https://sandbox.tradier.com/v1"
  live_base_url:  "https://api.tradier.com/v1"
  timeout_seconds: 10
  order_class: "option"

# ── Data Sources ─────────────────────────────────────────────
polygon:
  base_url: "https://api.polygon.io"
  ws_url: "wss://socket.polygon.io/options"
  snapshot_batch_size: 50

benzinga:
  base_url: "https://api.benzinga.com/api/v2"
  catalyst_keywords:
    - "FDA"
    - "NDA"
    - "BLA"
    - "IND"
    - "PDUFA"
    - "phase 1"
    - "phase 2"
    - "phase 3"
    - "trial results"
    - "clinical"
    - "approval"
    - "orphan drug"
    - "breakthrough therapy"
    - "earnings"
    - "beat"
    - "upgrade"
    - "downgrade"
    - "merger"
    - "acquisition"
    - "deal"
    - "contract"
    - "partnership"
  catalyst_lookback_hours: 48    # Look back 48h (was 24h)

# ── Correlation (Energy) ─────────────────────────────────────
correlation:
  crude_proxy: "USO"
  correlation_timeframe: "5m"
  min_alignment: false           # Don't require USO alignment (was true)

# ── Dashboard ────────────────────────────────────────────────
dashboard:
  refresh_rate: 1.0
  max_trade_log_rows: 50

# ── Logging ──────────────────────────────────────────────────
logging:
  level: "INFO"
  format: "json"
  file: "logs/bot.jsonl"
  max_bytes: 10_485_760
  backup_count: 5

# ── Backtesting ──────────────────────────────────────────────
backtest:
  default_start: "2024-01-01"
  default_end:   "2024-12-31"
  initial_capital: 25_000.00
